{%- assign img_path = include.path | remove: ".jpg" | remove: ".jpeg" | remove: ".png" | remove: ".tiff" -%}

<figure>
  <picture>
    {%- if site.imagemagick.enabled and site.imagemagick.widths %}
    <source
      type="image/webp"
      srcset="{%- for i in site.imagemagick.widths -%}{{ img_path | relative_url }}-{{ i }}.webp {{ i }}w{%- unless forloop.last %}, {% endunless -%}{%- endfor -%}"
      {% if include.sizes %}sizes="{{ include.sizes }}"{% else %}sizes="(max-width: 600px) 90vw, 800px"{% endif %}
    >
    {%- endif %}
    <img
      src="{{ include.path | relative_url }}"
      {% if include.class %}class="{{ include.class }}"{% endif %}
      {% if include.width %}width="{{ include.width }}"{% endif %}
      {% if include.height %}height="{{ include.height }}"{% endif %}
      {% if include.alt %}alt="{{ include.alt }}"{% endif %}
      {% if include.title %}title="{{ include.title }}"{% endif %}
      {% if include.zoomable %}data-zoomable{% endif %}
      loading="{{ include.loading | default: 'lazy' }}"
      decoding="async"
      {% if include.fetchpriority %}fetchpriority="{{ include.fetchpriority }}"{% endif %}
    >
  </picture>
  {%- if include.caption -%}<figcaption class="caption">{{ include.caption }}</figcaption>{%- endif %}
</figure>
